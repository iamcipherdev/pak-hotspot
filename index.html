<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAK HOTSPOT 🗞️ — Daily Tech + Pakistan News</title>
<meta name="description" content="PAK HOTSPOT — the daily newspaper-style drop of Pakistan headlines and global Tech/AI news. Fresh every morning.">
<style>
  :root{
    --paper:#f7f0dc; --paper2:#fffdf4; --ink:#161513; --muted:#6e6250;
    --accent:#e1062c; --line:#d9cba6; --thick:#161513;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
    line-height:1.55;font-size:16px}
  .display{font-family:Impact,"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:900;letter-spacing:-.01em;text-transform:uppercase;line-height:.95}

  /* ===== ticker ===== */
  .ticker{background:var(--ink);color:var(--paper);overflow:hidden;white-space:nowrap;
    border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:50}
  .ticker-track{display:inline-block;padding:9px 0;animation:tick 38s linear infinite}
  .ticker-track span{display:inline-block;padding:0 26px;font-size:13px;font-weight:700;
    letter-spacing:1.5px;text-transform:uppercase}
  .ticker-track b{color:var(--accent);margin-right:10px}
  @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media(prefers-reduced-motion:reduce){.ticker-track{animation:none}}

  .wrap{max-width:880px;margin:0 auto;padding:0 18px}

  /* ===== masthead ===== */
  .masthead{text-align:center;padding:30px 0 14px;border-bottom:5px solid var(--thick);position:relative}
  .edition{display:inline-block;font-size:11px;font-weight:800;letter-spacing:4px;
    text-transform:uppercase;border:2px solid var(--ink);padding:5px 14px;margin-bottom:14px;
    transform:rotate(-2deg);background:var(--paper2)}
  .edition em{font-style:normal;color:var(--accent)}
  h1.logo{font-size:clamp(52px,13.5vw,118px)}
  h1.logo .hot{color:var(--accent)}
  .dateline{margin-top:12px;padding-top:10px;border-top:1px solid var(--ink);
    display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;
    font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .dateline strong{color:var(--ink)}
  .fresh-stamp{position:absolute;top:18px;right:6px;background:var(--accent);color:#fff;
    font-weight:900;font-size:13px;letter-spacing:2px;padding:8px 14px;
    transform:rotate(9deg);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
    text-transform:uppercase}
  @media(max-width:560px){.fresh-stamp{font-size:11px;padding:6px 10px;top:12px}}

  /* ===== front page / hero ===== */
  .frontpage{margin:26px 0 6px;padding:30px 26px 24px;background:var(--paper2);
    border:3px solid var(--thick);box-shadow:7px 7px 0 var(--thick);position:relative}
  .breaking{display:inline-block;background:var(--ink);color:#fff;font-weight:900;
    font-size:13px;letter-spacing:2.5px;text-transform:uppercase;padding:7px 14px;
    transform:rotate(-3deg);margin-bottom:14px}
  .breaking i{font-style:normal;color:var(--accent)}
  .frontpage h2{font-size:clamp(28px,6vw,44px);margin-bottom:12px}
  .frontpage h2 a{color:inherit;text-decoration:none}
  .frontpage h2 a:hover{color:var(--accent)}
  .standfirst{font-size:17px;color:#33302a;margin-bottom:14px;max-width:60ch}
  .byline{font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .byline a{color:var(--accent);font-weight:800;text-decoration:none}
  .byline a:hover{text-decoration:underline}

  /* ===== sections ===== */
  section{margin-top:40px}
  .sechead{display:flex;align-items:center;gap:14px;border-bottom:4px solid var(--thick);
    padding-bottom:10px;margin-bottom:4px}
  .sechead h3{font-size:clamp(24px,5vw,34px);white-space:nowrap}
  .sechead .rule{flex:1;border-top:2px dashed var(--muted);height:0}
  .sechead .count{background:var(--accent);color:#fff;font-weight:900;font-size:13px;
    letter-spacing:1px;padding:5px 11px;transform:rotate(2deg);border:2px solid var(--ink)}

  .stories{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:720px){.stories{grid-template-columns:1fr 1fr;column-gap:34px}
    .stories article:nth-child(odd){border-right:1px solid var(--line);padding-right:30px}}
  article.story{padding:20px 2px;border-bottom:1px solid var(--line);position:relative}
  .story .row{display:flex;gap:14px;align-items:flex-start}
  .story .num{font-size:30px;color:transparent;-webkit-text-stroke:1.6px var(--ink);
    line-height:1;flex:0 0 auto;min-width:44px}
  .story h4{font-size:18.5px;line-height:1.32;letter-spacing:-.2px;margin-bottom:8px;font-weight:800}
  .story h4 a{color:var(--ink);text-decoration:none}
  .story h4 a:hover{color:var(--accent);text-decoration:underline;text-decoration-thickness:2px}
  .story p{font-size:14.5px;color:#403a2e;margin-bottom:10px}
  .sticker{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:2px;
    text-transform:uppercase;border:2px solid var(--ink);padding:3px 9px;margin-bottom:9px;
    background:#fff;transform:rotate(-2.5deg)}
  .sticker.hot{background:var(--accent);color:#fff}
  .sticker.cool{background:var(--ink);color:#fff}

  footer{margin:48px 0 40px;padding-top:16px;border-top:5px solid var(--thick);
    display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;
    font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  footer .end{font-weight:900;color:var(--ink)}
  .err{background:#ffe9ec;border:3px solid var(--accent);padding:16px;margin:26px 0;
    font-size:14px;font-weight:600}
</style>
</head>
<body>

<div class="ticker" aria-hidden="true"><div class="ticker-track" id="tickerTrack"></div></div>

<div class="wrap">
  <header class="masthead">
    <div class="fresh-stamp">Fresh ✨</div>
    <div class="edition">Vol. 01 · <em>Daily Drop</em> · No Cap Edition</div>
    <h1 class="logo display">PAK <span class="hot">HOTSPOT</span></h1>
    <div class="dateline">
      <span><strong id="today">—</strong></span>
      <span id="updated">Inking today&rsquo;s edition…</span>
      <span>Islamabad · The Internet</span>
    </div>
  </header>

  <div class="err" hidden id="errbox"></div>
  <div id="app"></div>

  <footer>
    <span>Printed fresh every morning · PKT</span>
    <span class="end">— 30 —</span>
    <span>Every story linked · Zero trackers</span>
  </footer>
</div>

<script>
(function(){
  var app = document.getElementById('app');
  var errbox = document.getElementById('errbox');
  var tickerTrack = document.getElementById('tickerTrack');

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function ago(iso){
    var t = new Date(iso).getTime(), now = Date.now(), d = now - t;
    if (isNaN(t)) return 'recently';
    var m = Math.floor(d/60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    var h = Math.floor(m/60);
    if (h < 24) return h + (h===1?' hour ago':' hours ago');
    var days = Math.floor(h/24);
    return days + (days===1?' day ago':' days ago');
  }
  var STICKERS = [
    '<span class="sticker hot">Just dropped 🔥</span>',
    '<span class="sticker">Fresh ✨</span>',
    '<span class="sticker cool">Lowkey big 👀</span>'
  ];
  function storyHTML(s, i){
    var sticker = (i === 0) ? STICKERS[0] : (i === 1 ? STICKERS[1] : '');
    return '<article class="story"><div class="row"><div class="num display">' +
      String(i+1).padStart(2,'0') + '</div><div>' + sticker +
      '<h4><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a></h4>' +
      '<p>' + esc(s.summary) + '</p>' +
      '<div class="byline">via <a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.source) + '</a></div>' +
      '</div></div></article>';
  }
  function sectionHTML(head, items){
    var h = '<section><div class="sechead"><h3 class="display">' + head + '</h3>' +
      '<span class="rule"></span><span class="count display">' + items.length + '</span></div>' +
      '<div class="stories">';
    items.forEach(function(s,i){ h += storyHTML(s,i); });
    return h + '</div></section>';
  }

  fetch('data/news.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      if(!d || !Array.isArray(d.tech) || !Array.isArray(d.pakistan)) throw new Error('bad schema');
      var hero = d.tech[0];

      // ticker: all headlines, doubled for seamless loop
      var all = d.tech.concat(d.pakistan);
      var tick = all.map(function(s,i){
        return '<span><b>●</b>' + esc(s.title) + '</span>';
      }).join('');
      tickerTrack.innerHTML = tick + tick;

      var html = '<article class="frontpage"><span class="breaking">Breaking <i>💥</i></span>' +
        '<h2 class="display"><a href="' + esc(hero.url) + '" target="_blank" rel="noopener">' +
        esc(hero.title) + '</a></h2>' +
        '<p class="standfirst">' + esc(hero.summary) + '</p>' +
        '<div class="byline">Front page · via <a href="' + esc(hero.url) + '" target="_blank" rel="noopener">' +
        esc(hero.source) + '</a></div></article>';
      html += sectionHTML('💻 Tech Desk', d.tech.slice(1));
      html += sectionHTML('🇵🇰 Pakistan Beat', d.pakistan);
      app.innerHTML = html;

      var dt = new Date(d.updated_at);
      document.getElementById('today').textContent =
        dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      document.getElementById('updated').innerHTML =
        'Updated <strong>' + esc(ago(d.updated_at)) + '</strong>';
    })
    .catch(function(e){
      errbox.hidden = false;
      errbox.textContent = 'Could not load today\u2019s edition (' + e.message + '). Check back shortly.';
      document.getElementById('updated').textContent = 'Edition delayed';
    });
})();
</script>
</body>
</html>
