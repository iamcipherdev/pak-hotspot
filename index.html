<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pak Hotspot — Pakistan + Tech/AI News, Daily</title>
<meta name="description" content="A daily editorial digest of Pakistan headlines and global Tech/AI news. Auto-updated every morning.">
<style>
  :root{
    --bg:#faf6ee; --ink:#16130e; --muted:#6f6656; --line:#e4dac6;
    --accent:#c75b21; --card:#fffdf8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    line-height:1.6;font-size:16px}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  /* masthead */
  header{border-bottom:3px double var(--ink);padding:28px 0 18px;margin-bottom:8px}
  .kicker{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
  h1.logo{font-family:Georgia,"Times New Roman",serif;font-weight:800;
    font-size:clamp(34px,7vw,52px);letter-spacing:-1px;line-height:1.05}
  h1.logo span{color:var(--accent)}
  .dateline{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;color:var(--muted);font-size:13px}
  .dateline strong{color:var(--ink)}
  /* hero */
  .hero{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);
    padding:26px 26px 22px;margin:26px 0 8px}
  .hero .tag{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px}
  .hero h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(24px,5vw,34px);
    line-height:1.2;letter-spacing:-.5px;margin-bottom:12px;font-weight:700}
  .hero p{color:#3d382c;font-size:16.5px;margin-bottom:14px}
  /* sections */
  section{margin-top:34px}
  section h3{font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:700;
    letter-spacing:-.3px;padding-bottom:10px;border-bottom:2px solid var(--ink);
    display:flex;justify-content:space-between;align-items:baseline}
  section h3 .count{font-family:-apple-system,"Segoe UI",sans-serif;font-size:12px;color:var(--muted);font-weight:400}
  article{padding:18px 2px;border-bottom:1px solid var(--line);display:grid;
    grid-template-columns:44px 1fr;gap:14px}
  article:last-child{border-bottom:none}
  .num{font-family:Georgia,serif;font-size:22px;color:var(--accent);font-weight:700;line-height:1.3}
  article h4{font-size:17px;line-height:1.4;margin-bottom:6px;font-weight:650;letter-spacing:-.2px}
  article h4 a{color:var(--ink);text-decoration:none}
  article h4 a:hover{color:var(--accent);text-decoration:underline}
  article p{font-size:14.5px;color:#4a4436;margin-bottom:8px}
  .src{font-size:12px;color:var(--muted);letter-spacing:.4px}
  .src a{color:var(--accent);text-decoration:none;font-weight:600}
  .src a:hover{text-decoration:underline}
  footer{margin:44px 0 34px;padding-top:18px;border-top:3px double var(--ink);
    color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
  .err{background:#fff3e8;border:1px solid var(--accent);padding:16px;margin:26px 0;font-size:14px}
  @media(max-width:520px){article{grid-template-columns:32px 1fr;gap:10px}.hero{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Daily Editorial Digest</div>
    <h1 class="logo">PAK <span>HOTSPOT</span></h1>
    <div class="dateline">
      <span><strong id="today">—</strong></span>
      <span id="updated">Updating…</span>
      <span>Pakistan &middot; Tech / AI</span>
    </div>
  </header>

  <div class="err" hidden id="errbox"></div>
  <div id="app"></div>

  <footer>
    <span>Curated every morning · PKT</span>
    <span>Sources linked on every story · No trackers</span>
  </footer>
</div>

<script>
(function(){
  var app = document.getElementById('app');
  var errbox = document.getElementById('errbox');

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function ago(iso){
    var t = new Date(iso).getTime(), now = Date.now(), d = now - t;
    if (isNaN(t)) return 'recently';
    var m = Math.floor(d/60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    var h = Math.floor(m/60);
    if (h < 24) return h + (h===1?' hour ago':' hours ago');
    var days = Math.floor(h/24);
    return days + (days===1?' day ago':' days ago');
  }
  function storyHTML(s, i){
    return '<article><div class="num">' + String(i+1).padStart(2,'0') + '</div><div>' +
      '<h4><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a></h4>' +
      '<p>' + esc(s.summary) + '</p>' +
      '<div class="src">Source: <a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.source) + '</a></div>' +
      '</div></article>';
  }
  function sectionHTML(name, items){
    var h = '<section><h3>' + esc(name) + '<span class="count">' + items.length + ' stories</span></h3>';
    items.forEach(function(s,i){ h += storyHTML(s,i); });
    return h + '</section>';
  }

  fetch('data/news.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      if(!d || !Array.isArray(d.tech) || !Array.isArray(d.pakistan)) throw new Error('bad schema');
      var hero = d.tech[0];
      var html = '<div class="hero"><div class="tag">Top story · Tech</div>' +
        '<h2><a href="' + esc(hero.url) + '" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">' +
        esc(hero.title) + '</a></h2><p>' + esc(hero.summary) + '</p>' +
        '<div class="src">Source: <a href="' + esc(hero.url) + '" target="_blank" rel="noopener">' + esc(hero.source) + '</a></div></div>';
      html += sectionHTML('Tech / AI', d.tech.slice(1));
      html += sectionHTML('Pakistan', d.pakistan);
      app.innerHTML = html + app.innerHTML;

      var dt = new Date(d.updated_at);
      document.getElementById('today').textContent =
        dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      document.getElementById('updated').innerHTML =
        'Updated <strong>' + esc(ago(d.updated_at)) + '</strong>';
    })
    .catch(function(e){
      errbox.hidden = false;
      errbox.textContent = 'Could not load today\u2019s digest (' + e.message + '). Please check back shortly.';
      document.getElementById('updated').textContent = 'Update pending';
    });
})();
</script>
</body>
</html>
